station:
  name: "Test_station"

camera:
  index: 0
  # Optional stable path; when set, this takes precedence over index.
  # device: "/dev/v4l/by-id/usb-046d_C270_HD_WEBCAM_200901010001-video-index0"

# For multiple cameras, REMOVE the camera section above and use cameras instead.
# Replace these placeholders with each camera's actual capture-device path.
# Do not enable unconnected cameras on a production station.
# cameras:
#   - name: "front"
#     device: "/dev/v4l/by-id/YOUR_FRONT_CAMERA-video-index0"
#   - name: "side"
#     device: "/dev/v4l/by-id/YOUR_SIDE_CAMERA-video-index0"

scanner:
  device: "/dev/input/by-id/usb-Datalogic_ADC_Inc._Handheld_Barcode_Scanner-event-kbd"

storage:
  local_directory: "/home/admin/Production_Photos"

azure:
  enabled: false
  storage_account: ""
  container: "photos"
  blob_prefix: "production"
  tenant_id: ""
  client_id: ""
  client_secret: ""

heartbeat:
  enabled: false
  table: "deviceheartbeats"
  interval_seconds: 60
